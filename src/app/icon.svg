<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <title>Digi-Toolbox</title>
  <!-- Toolbox (🧰) drawn from Blueprint's palette so it sits alongside the UI.
       Full-colour by design, so unlike a glyph it needs no light/dark flip.
       Also rendered in-app via src/components/ToolboxIcon.tsx, and rasterised
       into favicon.ico, so this file is the single source for the mark.
       The handle is deliberately wide and flat: a narrower, taller arch reads
       as a padlock shackle at favicon sizes. -->
  <path
    d="M19 21v-3a13 9 0 0 1 26 0v3"
    fill="none"
    stroke="#8f99a8"
    stroke-width="5"
    stroke-linecap="round"
  />
  <rect x="2" y="34" width="60" height="23" rx="4" fill="#ac2f33" />
  <rect x="2" y="21" width="60" height="14" rx="3" fill="#cd4246" />
  <rect x="25" y="30" width="14" height="7" rx="2" fill="#ec9a3c" />
</svg>
